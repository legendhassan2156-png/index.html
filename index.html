
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calgary Real 3D Drive</title>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
html,body,#map{width:100%;height:100%;margin:0;overflow:hidden}
#hud{position:absolute;top:15px;left:15px;background:#111d;
color:white;padding:14px;border-radius:10px;font:15px Arial;z-index:2}
#car{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);
background:#111d;color:white;padding:14px;border-radius:12px;z-index:2}
button{padding:10px;margin:3px;cursor:pointer}
</style>
</head>
<body>
<div id="map"></div>
<div id="hud">
<b>CALGARY DOWNTOWN DRIVE</b><br>
Real 3D map · <span id="speed">0</span> km/h<br>
<small>WASD / arrow keys to drive</small>
</div>
<div id="car">
<button id="left">◀</button>
<button id="gas">▲ GAS</button>
<button id="brake">▼ BRAKE</button>
<button id="right">▶</button>
</div>

<script>
const API_KEY = "PASTE_YOUR_GOOGLE_API_KEY_HERE";

// Calgary downtown starting location
const start = { lat: 51.045, lon: -114.070 };

const script = document.createElement("script");
script.src =
"https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Cesium.js";
script.onload = init;
document.head.appendChild(script);

async function init() {
  const viewer = new Cesium.Viewer("map", {
    animation:false,
    timeline:false,
    baseLayerPicker:false,
    geocoder:false,
    homeButton:false,
    sceneModePicker:false,
    navigationHelpButton:false,
    infoBox:false,
    selectionIndicator:false,
    imageryProvider:false,
    baseLayer:false
  });

  viewer.scene.globe.show = false;
  viewer.scene.backgroundColor = Cesium.Color.SKYBLUE;
  viewer.scene.screenSpaceCameraController.enableCollisionDetection = true;

  try {
    const tiles = await Cesium.createGooglePhotorealistic3DTileset({
      key: API_KEY
    });
    viewer.scene.primitives.add(tiles);
  } catch (e) {
    alert("3D map load nahi hua. API key, billing aur Map Tiles API check karo.");
    console.error(e);
  }

  let lon = start.lon, lat = start.lat;
  let heading = 0, speed = 0;
  const keys = {};
  let steering = 0, throttle = 0;

  addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
  });
  addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
  });

  function hold(id, value) {
    const el = document.getElementById(id);
    el.onpointerdown = e => {
      e.preventDefault();
      steering = value;
      throttle = id === "gas" ? 1 : id === "brake" ? -1 : throttle;
    };
    el.onpointerup = el.onpointerleave =
    el.onpointercancel = () => {
      steering = 0;
      throttle = 0;
    };
  }

  hold("left", -1);
  hold("right", 1);
  hold("gas", 0);
  hold("brake", 0);

  // Visible placeholder car. Movement is a prototype:
  // proper road-following and collision physics are not included.
  const car = viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(lon, lat, 2),
    box: {
      dimensions: new Cesium.Cartesian3(2, 4.4, 1.3),
      material: Cesium.Color.RED,
      outline: true,
      outlineColor: Cesium.Color.WHITE
    },
    orientation: Cesium.Transforms.headingPitchRollQuaternion(
      Cesium.Cartesian3.fromDegrees(lon, lat, 2),
      new Cesium.HeadingPitchRoll(0, 0, 0)
    )
  });

  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(lon, lat, 450),
    orientation: {
      heading: 0,
      pitch: Cesium.Math.toRadians(-35),
      roll: 0
    },
    duration: 2
  });

  let last = performance.now();

  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min((now-last)/1000, 0.05);
    last = now;

    const gas = keys.w || keys.arrowup || throttle > 0;
    const brake = keys.s || keys.arrowdown || throttle < 0;
    const left = keys.a || keys.arrowleft || steering < 0;
    const right = keys.d || keys.arrowright || steering > 0;

    if (gas) speed = Math.min(speed + 12*dt, 25);
    else if (brake) speed = Math.max(speed - 20*dt, -5);
    else speed *= Math.pow(0.985, dt*60);

    if (Math.abs(speed) > 0.1) {
      heading += ((left ? 1 : 0) - (right ? 1 : 0))
        * dt * 0.6 * Math.sign(speed);
    }

    const distance = speed * dt;
    const north = Math.cos(heading) * distance;
    const east = Math.sin(heading) * distance;
    lat += north / 111320;
    lon += east / (111320 * Math.cos(lat * Math.PI / 180));

    const position = Cesium.Cartesian3.fromDegrees(lon, lat, 2);
    car.position = position;
    car.orientation =
      Cesium.Transforms.headingPitchRollQuaternion(
        position,
        new Cesium.HeadingPitchRoll(heading, 0, 0)
      );

    // Follow the car with a third-person camera.
    const offset = Cesium.Cartesian3.fromElements(
      -Math.sin(heading)*16,
      -Math.cos(heading)*16,
      8
    );
    const destination = Cesium.Cartesian3.add(
      position, offset, new Cesium.Cartesian3()
    );
    viewer.camera.setView({
      destination,
      orientation: {
        heading: heading,
        pitch: Cesium.Math.toRadians(-18),
        roll: 0
      }
    });

    document.getElementById("speed").textContent =
      Math.round(Math.abs(speed)*3.6);
  }

  requestAnimationFrame(frame);
}
</script>
</body>
</html>
